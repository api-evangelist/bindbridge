name: Bindbridge
description: >-
  Bindbridge is an AI-driven molecular discovery company founded in 2025 and
  based in Cambridge, UK, developing next-generation crop protection through
  targeted protein degradation. Its BRIDGE platform uses AI to discover and
  design molecular glues and targeted protein degraders with novel modes of
  action against weeds and crop diseases, combining AI candidate generation,
  computational docking, molecular dynamics simulation, and free-energy binding
  calculations to accelerate agricultural R&D across herbicides, insecticides,
  and fungicides. The company raised $3.8M to help reduce billion-dollar crop
  losses and is backed by Speedinvest. Added to the API Evangelist network as a
  portfolio-lead company profile; it publishes no public API or developer
  surface as of this enrichment pass.
